<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎵 스페인어 뮤직비디오 학습</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #0d0d1a;
    color: #fff;
    font-family: 'Segoe UI', sans-serif;
    min-height: 100vh;
  }

  header {
    text-align: center;
    padding: 18px;
    background: linear-gradient(135deg, #1a0533, #0d1a33);
    border-bottom: 1px solid #333;
  }
  header h1 { font-size: 1.4rem; color: #f0a; letter-spacing: 2px; }
  header p { font-size: 0.8rem; color: #aaa; margin-top: 4px; }

  .main {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px;
    gap: 20px;
    max-width: 900px;
    margin: 0 auto;
  }

  .video-wrap {
    width: 100%;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 0 40px #f0a4;
    background: #000;
  }

  .yt-container {
    position: relative;
    width: 100%;
    padding-bottom: 56.25%;
    background: #000;
  }
  .yt-container iframe {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border: none;
  }

  .controls {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 10px 16px;
    background: #111;
    flex-wrap: wrap;
  }
  .controls label {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 0.85rem;
    color: #ccc;
    cursor: pointer;
    user-select: none;
  }
  .toggle-switch { position: relative; width: 40px; height: 22px; }
  .toggle-switch input { display: none; }
  .slider {
    position: absolute; inset: 0;
    background: #444; border-radius: 22px; transition: 0.3s; cursor: pointer;
  }
  .slider::before {
    content: ''; position: absolute;
    width: 16px; height: 16px; left: 3px; top: 3px;
    background: #fff; border-radius: 50%; transition: 0.3s;
  }
  input:checked + .slider { background: #f0a; }
  input:checked + .slider::before { transform: translateX(18px); }

  .sync-info { margin-left: auto; font-size: 0.75rem; color: #666; }

  /* Lyrics */
  .lyrics-panel {
    width: 100%;
    background: #111;
    border-radius: 12px;
    padding: 20px;
    border: 1px solid #222;
    max-height: 420px;
    overflow-y: auto;
    scroll-behavior: smooth;
  }

  .section-label {
    font-size: 0.7rem; color: #f0a; letter-spacing: 3px;
    text-transform: uppercase; margin: 16px 0 8px;
    padding: 4px 10px; background: #1a0526;
    border-radius: 4px; display: inline-block;
  }
  .section-label:first-child { margin-top: 0; }

  .lyric-line { margin: 6px 0; line-height: 1.7; padding: 3px 4px; border-radius: 4px; border-left: 3px solid transparent; }
  .lyric-line.active {
    border-left-color: #f0a;
    padding-left: 10px;
    background: #1a0d2a;
    border-radius: 0 6px 6px 0;
  }

  .es-text { font-size: 1.05rem; color: #eee; }
  .lyric-line.active .es-text .word { color: #ffe066; }

  .word {
    display: inline; cursor: pointer;
    border-radius: 3px; padding: 1px 2px;
    transition: background 0.15s, color 0.15s;
    white-space: pre-wrap;
  }
  .word:hover { background: #f0a3; color: #ffe066; }

  .ko-text {
    font-size: 0.88rem; color: #aaa;
    margin-top: 2px; display: none;
  }
  .ko-text.visible { display: block; }

  .stage-note { font-size: 0.8rem; color: #7080a0; font-style: italic; margin: 4px 0 8px; }

  /* Popup */
  #popup { position: fixed; display: none; z-index: 999; pointer-events: none; }
  #popup.show { display: block; }
  .popup-box {
    background: #1a0d2e; border: 1px solid #f0a;
    border-radius: 10px; padding: 14px 18px;
    min-width: 220px; max-width: 300px;
    box-shadow: 0 8px 30px #0009; pointer-events: all;
    position: relative;
  }
  .popup-word { font-size: 1.3rem; font-weight: bold; color: #f0a; margin-bottom: 4px; }
  .popup-pron { font-size: 0.85rem; color: #9ad; margin-bottom: 8px; }
  .popup-pron span { color: #7bf; font-style: italic; }
  .popup-meaning { font-size: 0.95rem; color: #eee; border-top: 1px solid #333; padding-top: 8px; }
  .popup-ko { font-size: 0.85rem; color: #bbb; margin-top: 6px; }
  .popup-close {
    position: absolute; top: 8px; right: 10px;
    cursor: pointer; color: #888; font-size: 1rem;
  }
  .popup-close:hover { color: #fff; }

  /* Vocab */
  .vocab-section { width: 100%; }
  .vocab-toggle-btn {
    width: 100%; background: #1a0d2e; border: 1px solid #333;
    color: #ccc; padding: 10px 16px; border-radius: 8px;
    cursor: pointer; font-size: 0.9rem; text-align: left; transition: background 0.2s;
  }
  .vocab-toggle-btn:hover { background: #270a44; }
  .vocab-grid {
    display: none;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 8px; margin-top: 10px;
  }
  .vocab-grid.open { display: grid; }
  .vocab-card {
    background: #111; border: 1px solid #2a1a3e;
    border-radius: 8px; padding: 10px 12px;
    cursor: pointer; transition: border-color 0.2s;
  }
  .vocab-card:hover { border-color: #f0a; }
  .vocab-card .vc-es { font-weight: bold; color: #f0a; }
  .vocab-card .vc-pron { font-size: 0.75rem; color: #7bf; }
  .vocab-card .vc-ko { font-size: 0.85rem; color: #ccc; margin-top: 4px; }
</style>
</head>
<body>

<header>
  <h1>🎵 스페인어 뮤직비디오 학습</h1>
  <p>자막 단어를 클릭하면 뜻과 발음을 확인할 수 있어요</p>
</header>

<div class="main">

  <div class="video-wrap">
    <div class="yt-container">
      <div id="ytPlayer"></div>
    </div>
    <div class="controls">
      <label>
        <span class="toggle-switch">
          <input type="checkbox" id="koToggle" checked>
          <span class="slider"></span>
        </span>
        한국어 자막
      </label>
      <label>
        <span class="toggle-switch">
          <input type="checkbox" id="autoScrollToggle" checked>
          <span class="slider"></span>
        </span>
        자동 스크롤
      </label>
      <span class="sync-info" id="syncInfo">⏱ 00:00</span>
    </div>
  </div>

  <div class="lyrics-panel" id="lyricsPanel"></div>

  <div class="vocab-section">
    <button class="vocab-toggle-btn" onclick="toggleVocab()">📚 단어장 펼치기 / 접기</button>
    <div class="vocab-grid" id="vocabGrid"></div>
  </div>

</div>

<div id="popup">
  <div class="popup-box" id="popupBox">
    <span class="popup-close" onclick="closePopup()">✕</span>
    <div class="popup-word" id="pWord"></div>
    <div class="popup-pron" id="pPron"></div>
    <div class="popup-meaning" id="pMeaning"></div>
    <div class="popup-ko" id="pKo"></div>
  </div>
</div>

// ─── Build lyrics DOM ─────────────────────────────────────────────────
const panel = document.getElementById('lyricsPanel');

function tokenize(text) {
  return text.split(/(\s+)/).map(tok => {
    if (/^\s+$/.test(tok)) return tok;
    const clean = tok.toLowerCase().replace(/[¡!¿?.,…]/g,'').trim();
    const span = document.createElement('span');
    span.className = 'word';
    span.textContent = tok;
    span.dataset.word = clean;
    span.addEventListener('click', e => showPopup(e, clean, tok));
    return span;
  });
}

LYRICS.forEach((line, i) => {
  if (line.section) {
    const lbl = document.createElement('div');
    lbl.className = 'section-label';
    lbl.textContent = line.section;
    panel.appendChild(lbl);
  }
  if (line.stage) {
    const stg = document.createElement('div');
    stg.className = 'stage-note';
    stg.textContent = line.stage;
    panel.appendChild(stg);
  }
  if (!line.es) return;

  const div = document.createElement('div');
  div.className = 'lyric-line';
  div.dataset.index = i;
  div.dataset.time = line.t;

  const esDiv = document.createElement('div');
  esDiv.className = 'es-text';
  tokenize(line.es).forEach(n => {
    if (typeof n === 'string') esDiv.appendChild(document.createTextNode(n));
    else esDiv.appendChild(n);
  });

  const koDiv = document.createElement('div');
  koDiv.className = 'ko-text';
  if (line.ko) koDiv.textContent = line.ko;

  div.appendChild(esDiv);
  div.appendChild(koDiv);
  panel.appendChild(div);
});

// ─── Korean toggle ────────────────────────────────────────────────────
const koToggle = document.getElementById('koToggle');
function applyKoToggle() {
  document.querySelectorAll('.ko-text').forEach(el => {
    el.classList.toggle('visible', koToggle.checked);
  });
}
koToggle.addEventListener('change', applyKoToggle);
applyKoToggle();

// ─── YouTube IFrame API ───────────────────────────────────────────────
let player = null;
let syncInterval = null;

window.onYouTubeIframeAPIReady = function() {
  player = new YT.Player('ytPlayer', {
    videoId: 'HKb68QsXVTk',
    host: 'https://www.youtube-nocookie.com',
    playerVars: {
      rel: 0,
      modestbranding: 1,
      playsinline: 1,
    },
    events: {
      onReady: () => {
        syncInterval = setInterval(syncLyrics, 250);
      }
    }
  });
};

function fmt(s) {
  s = Math.floor(s || 0);
  return String(Math.floor(s/60)).padStart(2,'0') + ':' + String(s%60).padStart(2,'0');
}

function syncLyrics() {
  if (!player || typeof player.getCurrentTime !== 'function') return;
  const t = player.getCurrentTime();
  document.getElementById('syncInfo').textContent = '⏱ ' + fmt(t);

  const lines = [...document.querySelectorAll('.lyric-line')];
  let activeIdx = -1;
  for (let i = 0; i < lines.length; i++) {
    if (parseFloat(lines[i].dataset.time) <= t) activeIdx = i;
    else break;
  }

  lines.forEach((l, i) => l.classList.toggle('active', i === activeIdx));

  if (activeIdx >= 0 && document.getElementById('autoScrollToggle').checked) {
    const activeLine = lines[activeIdx];
    const panelEl = document.getElementById('lyricsPanel');
    const relTop = activeLine.offsetTop - panelEl.offsetTop;
    const target = relTop - panelEl.clientHeight / 2 + activeLine.clientHeight / 2;
    panelEl.scrollTo({ top: target, behavior: 'smooth' });
  }
}

// ─── Popup ────────────────────────────────────────────────────────────
const popup = document.getElementById('popup');

function showPopup(e, clean, original) {
  e.stopPropagation();
  const entry = DICT[clean];
  document.getElementById('pWord').textContent = original;
  if (entry) {
    document.getElementById('pPron').innerHTML =
      `발음: <span>${entry.pron}</span> &nbsp; IPA: <span>${entry.ipa}</span>`;
    document.getElementById('pMeaning').textContent = '뜻: ' + entry.meaning;
    document.getElementById('pKo').textContent = entry.ko ? '📌 ' + entry.ko : '';
  } else {
    document.getElementById('pPron').innerHTML = '<span>발음 정보 없음</span>';
    document.getElementById('pMeaning').textContent = '단어를 클릭해 뜻을 확인하세요.';
    document.getElementById('pKo').textContent = '';
  }
  popup.classList.add('show');

  const box = document.getElementById('popupBox');
  let left = e.clientX + 12, top = e.clientY - 20;
  const w = 280, h = 140;
  if (left + w > window.innerWidth - 10) left = e.clientX - w - 12;
  if (top + h > window.innerHeight - 10) top = window.innerHeight - h - 10;
  if (top < 10) top = 10;
  popup.style.left = left + 'px';
  popup.style.top  = top  + 'px';
  popup.style.transform = '';
}

function closePopup() { popup.classList.remove('show'); }
document.addEventListener('click', e => {
  if (!popup.contains(e.target)) closePopup();
});

// ─── Vocab grid ───────────────────────────────────────────────────────
const vocabGrid = document.getElementById('vocabGrid');
Object.entries(DICT).forEach(([word, data]) => {
  const card = document.createElement('div');
  card.className = 'vocab-card';
  card.innerHTML = `<div class="vc-es">${word}</div>
    <div class="vc-pron">${data.pron}</div>
    <div class="vc-ko">${data.meaning}</div>`;
  card.addEventListener('click', () => {
    document.getElementById('pWord').textContent = word;
    document.getElementById('pPron').innerHTML =
      `발음: <span>${data.pron}</span> &nbsp; IPA: <span>${data.ipa}</span>`;
    document.getElementById('pMeaning').textContent = '뜻: ' + data.meaning;
    document.getElementById('pKo').textContent = data.ko ? '📌 ' + data.ko : '';
    popup.classList.add('show');
    popup.style.left = '50%';
    popup.style.top  = '50%';
    popup.style.transform = 'translate(-50%,-50%)';
  });
  vocabGrid.appendChild(card);
});

function toggleVocab() {
  document.getElementById('vocabGrid').classList.toggle('open');
}
